[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-index-optimizer"
version = "0.2.0"
description = "A workload-driven PostgreSQL index advisor for Django."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Yassin Bahri"}]
keywords = [
    "django",
    "postgresql",
    "postgres",
    "database",
    "indexes",
    "index-advisor",
    "index-optimization",
    "performance",
    "query-performance",
    "query-optimization",
    "pg-stat-statements",
    "hypopg",
    "database-performance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Django>=5.2,<6.2",
    "sqlglot>=30,<31",
]

[project.urls]
Homepage = "https://github.com/yassinbahri/PostgreSQL-Index-Advisor-for-Django"
Documentation = "https://github.com/yassinbahri/PostgreSQL-Index-Advisor-for-Django#readme"
Issues = "https://github.com/yassinbahri/PostgreSQL-Index-Advisor-for-Django/issues"
Changelog = "https://github.com/yassinbahri/PostgreSQL-Index-Advisor-for-Django/releases"

[project.optional-dependencies]
test = [
    "psycopg[binary]>=3.2",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgresql: requires a live PostgreSQL database",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["optimizer*"]
