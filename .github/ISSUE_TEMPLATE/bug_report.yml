name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve PostgreSQL Index Advisor for Django.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the command, relevant model/query, and complete error.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Python, Django, PostgreSQL, and django-index-optimizer versions.
      placeholder: Python 3.12, Django 5.2, PostgreSQL 16, django-index-optimizer 0.1.0
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized SQL, configuration details, or screenshots if useful.
